# Server block for the static SPA build. Listens on 8080 because the image runs
# as a non-root user and cannot bind port 80.
server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # NOTE: add_header in a location block replaces the ones set here, so locations
  # below use `expires` (which does not) to keep these on every response.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Liveness probe used by the Docker HEALTHCHECK.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Vite fingerprints everything in /assets, so it is safe to cache for a year.
  # A missing file must 404, not fall back to index.html (that would be served to
  # the browser as JavaScript and fail with a confusing syntax error).
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # Never serve dotfiles.
  location ~ /\. {
    deny all;
  }

  # Everything else is a client-side route (history mode): serve the app shell.
  # `expires -1` sends Cache-Control: no-cache, so a new deploy is picked up at once.
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
